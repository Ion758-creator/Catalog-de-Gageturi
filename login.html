<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadget Story | Login & Register</title>
  <link rel="stylesheet" href="login.css">
  <link rel="icon" type="image/png" href="downloads/icon.png">
</head>
<body>

  <div class="container">
    <div class="form-box">
      <h1 id="title">Login</h1>
      <form id="loginForm">
        <div class="input-group">
          <div class="input-field" id="nameField">
            <input type="text" placeholder="Nume complet" id="nameInput">
          </div>
          <div class="input-field">
            <input type="email" placeholder="Email" id="emailInput" required>
          </div>
          <div class="input-field">
            <input type="password" placeholder="Parolă" id="passwordInput" required>
          </div>
          <p>Ai uitat parola? <a href="#">Resetează aici</a></p>
        </div>
        <div class="btn-field">
          <button type="button" id="signinBtn">Login</button>
          <button type="button" class="disable" id="signupBtn">Register</button>
        </div>
      </form>
    </div>
  </div>

  <!-- legăm fișierul JS -->
  <script src="login.js"></script>
</body>
</html>
